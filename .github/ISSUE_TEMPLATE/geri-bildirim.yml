name: Geri bildirim / deneme raporu
description: Denedin mi? Ne çalıştı, ne çalışmadı? Kısa bir not yeter.
title: "Geri bildirim: "
labels: [geri-bildirim]
body:
  - type: markdown
    attributes:
      value: "Kullanım deneyimini paylaştığın için teşekkürler. Lütfen kişisel veri, konum, fotoğraf veya sohbet içeriği paylaşma; gerekiyorsa örneği anonimleştir."
  - type: input
    attributes:
      label: "Python sürümü ve işletim sistemi"
      description: "Örn. Python 3.12, macOS"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Ne denedin ve sonuç ne oldu?"
      description: "QR kod hangi telefonla okundu, okunmadıysa hangi adresle denedin?"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Önerin var mı?"
      description: "Hiçbir şey yazmasan da olur."
    validations:
      required: false
